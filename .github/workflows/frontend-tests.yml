name: Frontend tests

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Several transitive dev deps (csstools/postcss chain) declare
          # engines >=20.19.0 / "20 || >=22", and vitest 4 needs vite 6+
          # as a peer while package.json still pins vite ^5 (npm resolves
          # that via a nested vite@8 copy — confirmed locally with `npm
          # ls vite vitest`). Node 20 is untested against this exact
          # lockfile and failed on the first CI run; pinned to the major
          # version actually verified locally (`node -v` / `npm ci`
          # reproduced clean) rather than guessing at a lower one.
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
